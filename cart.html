<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMA - Cart</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<script src="https://js.stripe.com/v3/"></script>
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
<style>
:root { --navy: #0F1B2E; --gold: #B87333; --cream: #F2E9DC; }
body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--cream); }
header { background: var(--navy); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
header h1 { color: var(--gold); font-family: 'Playfair Display', serif; margin: 0; font-size: 2rem; }
header p { color: var(--cream); margin: 0; font-size: 0.8rem; letter-spacing: 2px; }
nav a { color: var(--cream); text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
.cart-container { max-width: 800px; margin: 60px auto; padding: 0 20px; }
.cart-container h2 { font-family: 'Playfair Display', serif; color: var(--navy); margin-bottom: 30px; }
.cart-item { background: white; border-radius: 12px; padding: 20px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
.cart-item-info h3 { font-family: 'Playfair Display', serif; color: var(--navy); margin: 0 0 5px 0; }
.cart-item-info p { color: #666; font-size: 0.9rem; margin: 0; }
.cart-item-price { color: var(--gold); font-weight: 600; font-size: 1.1rem; }
.cart-item-remove { background: none; border: 1px solid #ddd; padding: 5px 10px; border-radius: 6px; cursor: pointer; color: #666; font-size: 0.8rem; margin-left: 15px; }
.cart-summary { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); margin-top: 20px; }
.cart-summary h3 { font-family: 'Playfair Display', serif; color: var(--navy); }
.cart-total { display: flex; justify-content: space-between; font-size: 1.2rem; font-weight: 600; color: var(--navy); margin: 15px 0; }
.btn-checkout { background: var(--gold); color: var(--navy); border: none; padding: 15px; width: 100%; border-radius: 6px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 1rem; margin-top: 15px; }
.empty-cart { text-align: center; padding: 60px; color: #666; }
.empty-cart a { color: var(--gold); text-decoration: none; font-weight: 600; }
footer { background: var(--navy); color: var(--cream); text-align: center; padding: 30px; font-size: 0.85rem; letter-spacing: 2px; margin-top: 60px; }
#card-element { border: 1px solid #ddd; border-radius: 6px; padding: 12px; background: white; margin-bottom: 15px; }
#card-errors { color: red; font-size: 0.85rem; margin-bottom: 10px; }
.test-card-info { background: #f0f8ff; border-radius: 6px; padding: 10px; margin-bottom: 15px; font-size: 0.8rem; color: #666; }
.email-field { width: 100%; padding: 10px; margin-bottom: 15px; border: 1px solid #ddd; border-radius: 6px; font-family: 'Montserrat', sans-serif; box-sizing: border-box; font-size: 0.9rem; }
.email-label { font-size: 0.85rem; color: #666; margin-bottom: 6px; display: block; }
</style>
</head>
<body>
<header>
  <div><h1>ALMA</h1><p>TASTE THE SOUL OF VENEZUELA</p></div>
  <nav><a href="index.html">Products</a><a href="cart.html">Cart</a></nav>
</header>

<div class="cart-container">
  <h2>Your Cart</h2>
  <div id="cartItems"></div>
  <div class="cart-summary" id="cartSummary" style="display:none">
    <h3>Order Summary</h3>
    <div class="cart-total">
      <span>Total</span>
      <span id="cartTotal">$0.00</span>
    </div>
    <label class="email-label">Confirmation email</label>
    <input type="email" class="email-field" id="checkoutEmail" placeholder="your@email.com">
    <div class="test-card-info">
      Test card: 4242 4242 4242 4242 | Any future date | Any CVC
    </div>
    <div id="card-element"></div>
    <div id="card-errors"></div>
    <button class="btn-checkout" id="checkoutBtn" onclick="handlePayment()">Pay with Stripe</button>
  </div>
</div>

<footer>ALMA · TASTE THE SOUL OF VENEZUELA · TORONTO</footer>

<script>
const STRIPE_KEY = 'pk_test_51UQeA4RxRV699S9tpHAe5Goy2ai0vKJHeQyqoTTMaOv9D73WNzvdKBpyowc7mFoGsBYkC2Hz4uaEoucgwCA1C54N00FcjNUMwj';
const stripe = Stripe(STRIPE_KEY);
const elements = stripe.elements();
const cardElement = elements.create('card', {
  style: { base: { fontFamily: 'Montserrat, sans-serif', fontSize: '16px', color: '#0F1B2E' } }
});

const poolData = { UserPoolId: 'us-east-1_2j5XfbyQ8', ClientId: '6hahghern9ph1b6no8mqo6l4p1' };
const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);

function prefillEmail() {
  const cognitoUser = userPool.getCurrentUser();
  if (cognitoUser) {
    cognitoUser.getSession((err, session) => {
      if (!err && session.isValid()) {
        cognitoUser.getUserAttributes((err, attrs) => {
          const emailAttr = attrs && attrs.find(a => a.Name === 'email');
          if (emailAttr) {
            document.getElementById('checkoutEmail').value = emailAttr.Value;
          }
        });
      }
    });
  }
}

function renderCart() {
  const cart = JSON.parse(localStorage.getItem('alma-cart') || '[]');
  const cartItems = document.getElementById('cartItems');
  const cartSummary = document.getElementById('cartSummary');

  if (cart.length === 0) {
    cartItems.innerHTML = '<div class="empty-cart"><p>Your cart is empty.</p><a href="index.html">Continue shopping</a></div>';
    cartSummary.style.display = 'none';
    return;
  }

  let total = 0;
  cartItems.innerHTML = '';

  cart.forEach((item, index) => {
    total += parseFloat(item.price);
    cartItems.innerHTML += `
      <div class="cart-item">
        <div class="cart-item-info">
          <h3>${item.name}</h3>
          <p>${item.category}</p>
        </div>
        <div style="display:flex;align-items:center">
          <span class="cart-item-price">$${item.price}</span>
          <button class="cart-item-remove" onclick="removeItem(${index})">Remove</button>
        </div>
      </div>`;
  });

  document.getElementById('cartTotal').textContent = '$' + total.toFixed(2);
  cartSummary.style.display = 'block';
  cardElement.mount('#card-element');
  prefillEmail();
}

function removeItem(index) {
  const cart = JSON.parse(localStorage.getItem('alma-cart') || '[]');
  cart.splice(index, 1);
  localStorage.setItem('alma-cart', JSON.stringify(cart));
  renderCart();
}

async function handlePayment() {
  const btn = document.getElementById('checkoutBtn');
  btn.textContent = 'Processing...';
  btn.disabled = true;

  const {paymentMethod, error} = await stripe.createPaymentMethod({
    type: 'card',
    card: cardElement
  });

  if (error) {
    document.getElementById('card-errors').textContent = error.message;
    btn.textContent = 'Pay with Stripe';
    btn.disabled = false;
    return;
  }

  const cart = JSON.parse(localStorage.getItem('alma-cart') || '[]');
  const total = cart.reduce((sum, item) => sum + parseFloat(item.price), 0);
  const email = document.getElementById('checkoutEmail').value || 'leandrodg5@gmail.com';

  try {
    const response = await fetch('https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/orders', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        items: cart,
        total: total.toFixed(2),
        email: email,
        paymentMethodId: paymentMethod.id
      })
    });

    const result = await response.json();

    if (result.success) {
      localStorage.setItem('alma-order', JSON.stringify(cart));
      localStorage.removeItem('alma-cart');
      window.location.href = 'confirmation.html';
    }
  } catch (error) {
    localStorage.setItem('alma-order', JSON.stringify(cart));
    localStorage.removeItem('alma-cart');
    window.location.href = 'confirmation.html';
  }
}

renderCart();
</script>
</body>
</html>
