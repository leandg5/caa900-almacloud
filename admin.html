<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALMA Cloud — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold2: #E8D49A;
      --gold-dim: rgba(201,168,76,0.12);
      --bg: #0C0C0C;
      --surface: #141414;
      --surface2: #1C1C1C;
      --border: rgba(255,255,255,0.07);
      --text: #F2EFE9;
      --muted: #666;
      --muted2: #999;
      --green: #3ECF8E;
      --green-dim: rgba(62,207,142,0.1);
      --sidebar-w: 240px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
    }

    /* SIDEBAR */
    .sidebar {
      width: var(--sidebar-w);
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      position: fixed;
      top: 0; left: 0; bottom: 0;
      z-index: 10;
    }

    .sidebar-brand {
      padding: 1.75rem 1.5rem 1.25rem;
      border-bottom: 1px solid var(--border);
    }

    .brand-name {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--gold);
      letter-spacing: 0.1em;
      line-height: 1;
    }

    .brand-sub {
      font-size: 0.65rem;
      color: var(--muted2);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-top: 0.3rem;
    }

    .sidebar-nav {
      flex: 1;
      padding: 1.25rem 0.75rem;
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .nav-label {
      font-size: 0.6rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.15em;
      color: var(--muted);
      padding: 0.75rem 0.75rem 0.4rem;
    }

    .nav-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.65rem 0.85rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.875rem;
      color: var(--muted2);
      transition: all 0.15s;
      border: none;
      background: none;
      width: 100%;
      text-align: left;
      font-family: 'Inter', sans-serif;
    }

    .nav-item:hover { background: var(--surface2); color: var(--text); }

    .nav-item.active {
      background: var(--gold-dim);
      color: var(--gold);
      font-weight: 600;
    }

    .nav-icon { font-size: 1rem; width: 20px; text-align: center; }

    .sidebar-footer {
      padding: 1rem 1.25rem;
      border-top: 1px solid var(--border);
    }

    .store-btn {
      display: block;
      text-align: center;
      padding: 0.6rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--muted2);
      text-decoration: none;
      font-size: 0.8rem;
      transition: all 0.15s;
    }
    .store-btn:hover { border-color: var(--gold); color: var(--gold); }

    /* MAIN */
    .main {
      margin-left: var(--sidebar-w);
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .topbar {
      padding: 1.25rem 2rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
    }

    .page-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
    }

    .page-sub { font-size: 0.8rem; color: var(--muted2); margin-top: 0.1rem; }

    .status-dot {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.78rem;
      color: var(--green);
    }

    .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .content { padding: 2rem; flex: 1; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* STAT CARDS */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.5rem;
      position: relative;
      overflow: hidden;
      transition: border-color 0.2s;
    }

    .stat-card:hover { border-color: rgba(201,168,76,0.3); }

    .stat-card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 80px; height: 80px;
      background: radial-gradient(circle at top right, rgba(201,168,76,0.08), transparent 70%);
    }

    .stat-icon {
      font-size: 1.4rem;
      margin-bottom: 1rem;
      display: block;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted2);
      margin-bottom: 0.5rem;
    }

    .stat-value {
      font-size: 2.2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
      font-variant-numeric: tabular-nums;
    }

    .stat-value.gold { color: var(--gold); }

    .stat-trend {
      font-size: 0.75rem;
      color: var(--green);
      margin-top: 0.5rem;
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    /* GRID LAYOUT */
    .dashboard-grid {
      display: grid;
      grid-template-columns: 1fr 320px;
      gap: 1.25rem;
    }

    /* PANEL */
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
    }

    .panel-header {
      padding: 1.1rem 1.5rem;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .panel-title {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text);
    }

    .panel-badge {
      font-size: 0.7rem;
      background: var(--gold-dim);
      color: var(--gold);
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-weight: 600;
    }

    /* TABLE */
    table { width: 100%; border-collapse: collapse; }

    th {
      padding: 0.7rem 1.25rem;
      text-align: left;
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.85rem 1.25rem;
      font-size: 0.83rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }

    tr:hover td { background: rgba(255,255,255,0.02); }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .badge::before { content: ''; width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

    .badge-confirmed { background: var(--green-dim); color: var(--green); }
    .badge-pending { background: var(--gold-dim); color: var(--gold); }

    .amount { color: var(--gold); font-weight: 600; font-variant-numeric: tabular-nums; }
    .order-id { font-size: 0.72rem; color: var(--muted2); font-family: 'SF Mono', monospace; }
    .item-names { font-size: 0.8rem; }
    .item-count { font-size: 0.72rem; color: var(--muted2); }

    /* RIGHT PANEL — Revenue bars */
    .revenue-list { padding: 1rem 1.25rem; display: flex; flex-direction: column; gap: 1rem; }

    .rev-item { display: flex; flex-direction: column; gap: 0.4rem; }

    .rev-meta { display: flex; justify-content: space-between; align-items: center; }

    .rev-email { font-size: 0.78rem; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 170px; }

    .rev-amount { font-size: 0.78rem; color: var(--gold); font-weight: 600; }

    .rev-bar-bg { height: 4px; background: var(--surface2); border-radius: 4px; overflow: hidden; }

    .rev-bar { height: 100%; background: linear-gradient(90deg, var(--gold), var(--gold2)); border-radius: 4px; transition: width 0.8s ease; }

    /* EMPTY */
    .empty-row td { text-align: center; color: var(--muted2); padding: 3rem; }

    /* PRODUCT TAB */
    .product-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1.25rem;
    }

    .page-heading {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.6rem;
      font-weight: 600;
    }

    .btn {
      padding: 0.6rem 1.25rem;
      border-radius: 8px;
      border: none;
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.15s;
    }

    .btn-primary { background: var(--gold); color: #0C0C0C; }
    .btn-primary:hover { background: var(--gold2); }

    .btn-ghost { background: var(--surface2); color: var(--muted2); border: 1px solid var(--border); }
    .btn-ghost:hover { color: var(--text); }

    .btn-edit {
      background: var(--gold-dim);
      color: var(--gold);
      border: 1px solid rgba(201,168,76,0.2);
      font-size: 0.75rem;
      padding: 0.28rem 0.7rem;
    }

    .btn-del {
      background: rgba(239,68,68,0.1);
      color: #F87171;
      border: 1px solid rgba(239,68,68,0.2);
      font-size: 0.75rem;
      padding: 0.28rem 0.7rem;
    }

    .btn-del:hover { background: rgba(239,68,68,0.2); }

    /* FORM MODAL */
    .form-overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      align-items: center;
      justify-content: center;
    }

    .form-overlay.open { display: flex; }

    .form-modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 2rem;
      width: 520px;
      max-width: 95vw;
    }

    .modal-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 0.68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--muted2);
    }

    input, select, textarea {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.65rem 0.9rem;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--gold); }

    select option { background: var(--surface2); }

    textarea { resize: vertical; min-height: 80px; }

    .modal-actions { display: flex; gap: 0.75rem; margin-top: 1.5rem; justify-content: flex-end; }

    /* PRODUCT CARD GRID */
    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 1rem;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      transition: border-color 0.2s, transform 0.2s;
    }

    .product-card:hover { border-color: rgba(201,168,76,0.3); transform: translateY(-2px); }

    .product-card-cat {
      font-size: 0.65rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--gold);
      margin-bottom: 0.4rem;
    }

    .product-card-name {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 0.35rem;
    }

    .product-card-desc {
      font-size: 0.78rem;
      color: var(--muted2);
      margin-bottom: 1rem;
      line-height: 1.5;
      min-height: 36px;
    }

    .product-card-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .product-card-price {
      font-size: 1.2rem;
      font-weight: 700;
      color: var(--gold);
    }

    .card-actions { display: flex; gap: 0.5rem; }
  </style>
</head>
<body>

<!-- SIDEBAR -->
<aside class="sidebar">
  <div class="sidebar-brand">
    <div class="brand-name">ALMA</div>
    <div class="brand-sub">Venezuelan Flavours</div>
  </div>
  <nav class="sidebar-nav">
    <div class="nav-label">Main</div>
    <button class="nav-item active" onclick="switchTab('orders', this)">
      <span class="nav-icon">📊</span> Dashboard
    </button>
    <button class="nav-item" onclick="switchTab('products', this)">
      <span class="nav-icon">🧃</span> Products
    </button>
  </nav>
  <div class="sidebar-footer">
    <a href="index.html" class="store-btn">← View Store</a>
  </div>
</aside>

<!-- MAIN -->
<div class="main">
  <div class="topbar">
    <div>
      <div class="page-title" id="topbarTitle">Dashboard</div>
      <div class="page-sub" id="topbarSub">Overview of orders and revenue</div>
    </div>
    <div class="status-dot"><span class="dot"></span> Live</div>
  </div>

  <div class="content">

    <!-- ORDERS TAB -->
    <div id="tab-orders" class="tab-content active">
      <div class="stats-grid">
        <div class="stat-card">
          <span class="stat-icon">🛒</span>
          <div class="stat-label">Total Orders</div>
          <div class="stat-value" id="statOrders">—</div>
          <div class="stat-trend" id="trendOrders"></div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">💰</span>
          <div class="stat-label">Total Revenue</div>
          <div class="stat-value gold" id="statRevenue">—</div>
          <div class="stat-trend" id="trendRevenue"></div>
        </div>
        <div class="stat-card">
          <span class="stat-icon">📦</span>
          <div class="stat-label">Products Available</div>
          <div class="stat-value" id="statProducts">—</div>
          <div class="stat-trend"></div>
        </div>
      </div>

      <div class="dashboard-grid">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Recent Orders</span>
            <span class="panel-badge" id="orderCount">0 orders</span>
          </div>
          <table>
            <thead>
              <tr>
                <th>Order</th>
                <th>Customer</th>
                <th>Items</th>
                <th>Total</th>
                <th>Status</th>
              </tr>
            </thead>
            <tbody id="ordersBody">
              <tr class="empty-row"><td colspan="5">Loading...</td></tr>
            </tbody>
          </table>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">Top Customers</span>
          </div>
          <div class="revenue-list" id="topCustomers"></div>
        </div>
      </div>
    </div>

    <!-- PRODUCTS TAB -->
    <div id="tab-products" class="tab-content">
      <div class="product-toolbar">
        <div class="page-heading">Products</div>
        <button class="btn btn-primary" onclick="openForm()">+ Add Product</button>
      </div>
      <div class="product-grid" id="productsGrid">
        <div style="color:var(--muted2);padding:2rem">Loading products...</div>
      </div>
    </div>

  </div>
</div>

<!-- FORM MODAL -->
<div class="form-overlay" id="formOverlay" onclick="if(event.target===this)closeForm()">
  <div class="form-modal">
    <div class="modal-title" id="formTitle">Add Product</div>
    <input type="hidden" id="editId" />
    <div class="form-grid">
      <div class="form-group">
        <label>Name</label>
        <input type="text" id="pName" placeholder="e.g. Maracuyá Burst" />
      </div>
      <div class="form-group">
        <label>Category</label>
        <select id="pCategory">
          <option value="">Select</option>
          <option value="Beverages">Beverages</option>
          <option value="Bakery">Bakery</option>
          <option value="Market">Market</option>
        </select>
      </div>
      <div class="form-group">
        <label>Price (CAD)</label>
        <input type="number" id="pPrice" step="0.01" placeholder="0.00" />
      </div>
      <div class="form-group">
        <label>Image URL (optional)</label>
        <input type="text" id="pImage" placeholder="https://..." />
      </div>
      <div class="form-group full">
        <label>Description</label>
        <textarea id="pDesc" placeholder="Short description..."></textarea>
      </div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-ghost" onclick="closeForm()">Cancel</button>
      <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
    </div>
  </div>
</div>

<script>
  const PRODUCTS_API = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/products';
  const ORDERS_API   = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/orders';

  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    btn.classList.add('active');
    document.getElementById('topbarTitle').textContent = tab === 'orders' ? 'Dashboard' : 'Products';
    document.getElementById('topbarSub').textContent = tab === 'orders' ? 'Overview of orders and revenue' : 'Manage your product catalog';
  }

  function fmt(date) {
    return new Date(date).toLocaleDateString('en-CA', { month: 'short', day: 'numeric' });
  }

  async function loadOrders() {
    try {
      const res = await fetch(ORDERS_API);
      const data = await res.json();
      const orders = Array.isArray(data) ? data : (data.orders || []);

      document.getElementById('statOrders').textContent = orders.length;
      const revenue = orders.reduce((sum, o) => sum + parseFloat(o.total || 0), 0);
      document.getElementById('statRevenue').textContent = '$' + revenue.toFixed(2);
      document.getElementById('orderCount').textContent = orders.length + ' orders';

      // Trend labels
      document.getElementById('trendOrders').innerHTML = '↑ All time';
      document.getElementById('trendRevenue').innerHTML = '↑ CAD ' + revenue.toFixed(2);

      // Top customers
      const byCustomer = {};
      orders.forEach(o => {
        const e = o.email || 'unknown';
        byCustomer[e] = (byCustomer[e] || 0) + parseFloat(o.total || 0);
      });
      const sorted = Object.entries(byCustomer).sort((a, b) => b[1] - a[1]).slice(0, 5);
      const max = sorted[0]?.[1] || 1;
      document.getElementById('topCustomers').innerHTML = sorted.map(([email, amt]) => `
        <div class="rev-item">
          <div class="rev-meta">
            <span class="rev-email">${email}</span>
            <span class="rev-amount">$${amt.toFixed(2)}</span>
          </div>
          <div class="rev-bar-bg"><div class="rev-bar" style="width:${(amt/max*100).toFixed(1)}%"></div></div>
        </div>
      `).join('');

      // Orders table
      const recent = [...orders].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 8);
      const tbody = document.getElementById('ordersBody');
      if (!recent.length) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No orders yet.</td></tr>';
        return;
      }
      tbody.innerHTML = recent.map(o => {
        const names = (o.items || []).map(i => i.name).join(', ');
        const count = (o.items || []).length;
        const badge = o.status === 'confirmed'
          ? '<span class="badge badge-confirmed">Confirmed</span>'
          : '<span class="badge badge-pending">' + (o.status || 'pending') + '</span>';
        return `<tr>
          <td>
            <div class="order-id">#${o.id}</div>
            <div style="font-size:0.72rem;color:var(--muted2)">${o.createdAt ? fmt(o.createdAt) : ''}</div>
          </td>
          <td style="font-size:0.8rem;max-width:140px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${o.email || '—'}</td>
          <td>
            <div class="item-names">${names || '—'}</div>
            <div class="item-count">${count} item${count !== 1 ? 's' : ''}</div>
          </td>
          <td><span class="amount">$${parseFloat(o.total).toFixed(2)}</span></td>
          <td>${badge}</td>
        </tr>`;
      }).join('');

    } catch (err) {
      document.getElementById('ordersBody').innerHTML =
        '<tr class="empty-row"><td colspan="5">Error: ' + err.message + '</td></tr>';
    }
  }

  let allProducts = [];

  async function loadProducts() {
    try {
      const res = await fetch(PRODUCTS_API);
      const data = await res.json();
      allProducts = Array.isArray(data) ? data : (data.products || data.items || []);
      document.getElementById('statProducts').textContent = allProducts.length;

      const grid = document.getElementById('productsGrid');
      if (!allProducts.length) {
        grid.innerHTML = '<div style="color:var(--muted2);padding:2rem">No products yet.</div>';
        return;
      }

      grid.innerHTML = allProducts.map(p => `
        <div class="product-card">
          <div class="product-card-cat">${p.category || 'Uncategorized'}</div>
          <div class="product-card-name">${p.name}</div>
          <div class="product-card-desc">${p.description || 'No description.'}</div>
          <div class="product-card-footer">
            <div class="product-card-price">$${parseFloat(p.price || 0).toFixed(2)}</div>
            <div class="card-actions">
              <button class="btn btn-edit" onclick="editProduct('${p.id}')">Edit</button>
              <button class="btn btn-del" onclick="deleteProduct('${p.id}','${p.name.replace(/'/g,"\\'")}')">Delete</button>
            </div>
          </div>
        </div>
      `).join('');

    } catch (err) {
      document.getElementById('productsGrid').innerHTML =
        '<div style="color:#F87171;padding:2rem">Error: ' + err.message + '</div>';
    }
  }

  function openForm() {
    document.getElementById('formOverlay').classList.add('open');
  }

  function closeForm() {
    document.getElementById('formOverlay').classList.remove('open');
    resetForm();
  }

  function resetForm() {
    document.getElementById('editId').value = '';
    document.getElementById('pName').value = '';
    document.getElementById('pCategory').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pImage').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('formTitle').textContent = 'Add Product';
  }

  function editProduct(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('editId').value = p.id;
    document.getElementById('pName').value = p.name;
    document.getElementById('pCategory').value = p.category || '';
    document.getElementById('pPrice').value = p.price;
    document.getElementById('pImage').value = p.image || '';
    document.getElementById('pDesc').value = p.description || '';
    document.getElementById('formTitle').textContent = 'Edit Product';
    openForm();
  }

  async function saveProduct() {
    const id = document.getElementById('editId').value;
    const body = {
      name: document.getElementById('pName').value.trim(),
      category: document.getElementById('pCategory').value,
      price: parseFloat(document.getElementById('pPrice').value),
      image: document.getElementById('pImage').value.trim(),
      description: document.getElementById('pDesc').value.trim()
    };

    if (!body.name || !body.category || isNaN(body.price)) {
      alert('Name, category and price are required.');
      return;
    }

    if (id) body.id = id;

    try {
      const res = await fetch(PRODUCTS_API, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      closeForm();
      loadProducts();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  async function deleteProduct(id, name) {
    if (!confirm('Delete "' + name + '"?')) return;
    try {
      const res = await fetch(PRODUCTS_API, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      loadProducts();
    } catch (err) {
      alert('Error: ' + err.message);
    }
  }

  loadOrders();
  loadProducts();
</script>
</body>
</html>
