<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMA - Owner Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root { --navy: #0F1B2E; --gold: #B87333; --cream: #F2E9DC; }
body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--cream); }
header { background: var(--navy); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
header h1 { color: var(--gold); font-family: 'Playfair Display', serif; margin: 0; font-size: 2rem; }
header p { color: var(--cream); margin: 0; font-size: 0.8rem; letter-spacing: 2px; }
nav a { color: var(--cream); text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
.dashboard { max-width: 1000px; margin: 60px auto; padding: 0 20px; }
.dashboard h2 { font-family: 'Playfair Display', serif; color: var(--navy); margin-bottom: 30px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 40px; }
.stat-card { background: white; border-radius: 12px; padding: 25px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: center; }
.stat-card h3 { font-family: 'Playfair Display', serif; color: var(--navy); margin: 0 0 10px 0; font-size: 1rem; }
.stat-number { color: var(--gold); font-size: 2rem; font-weight: 600; }
.orders-table { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
.orders-table h3 { font-family: 'Playfair Display', serif; color: var(--navy); margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 10px; border-bottom: 2px solid var(--cream); color: var(--navy); font-size: 0.85rem; text-transform: uppercase; letter-spacing: 1px; }
td { padding: 12px 10px; border-bottom: 1px solid #eee; font-size: 0.9rem; }
.status-confirmed { color: green; font-weight: 600; }
.owner-badge { background: var(--gold); color: var(--navy); padding: 3px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
footer { background: var(--navy); color: var(--cream); text-align: center; padding: 30px; font-size: 0.85rem; letter-spacing: 2px; margin-top: 60px; }
</style>
</head>
<body>
<header>
  <div><h1>ALMA</h1><p>TASTE THE SOUL OF VENEZUELA</p></div>
  <nav>
    <span class="owner-badge">OWNER</span>
    <a href="index.html" style="margin-left:20px">Store</a>
  </nav>
</header>

<div class="dashboard">
  <h2>Owner Dashboard</h2>
  
  <div class="stats">
    <div class="stat-card">
      <h3>Total Orders</h3>
      <div class="stat-number" id="totalOrders">0</div>
    </div>
    <div class="stat-card">
      <h3>Total Revenue</h3>
      <div class="stat-number" id="totalRevenue">$0</div>
    </div>
    <div class="stat-card">
      <h3>Products Available</h3>
      <div class="stat-number">11</div>
    </div>
  </div>

  <div class="orders-table">
    <h3>Recent Orders</h3>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Email</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="ordersBody">
        <tr><td colspan="6" style="text-align:center;color:#666;padding:30px">Loading orders...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<footer>ALMA · OWNER DASHBOARD · TORONTO</footer>

<script>
const API_URL = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com';

async function loadOrders() {
  try {
    const response = await fetch(`${API_URL}/orders`);
    const orders = await response.json();
    
    const tbody = document.getElementById('ordersBody');
    
    if (!orders || orders.length === 0) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;color:#666;padding:30px">No orders yet</td></tr>';
      return;
    }

    let totalRevenue = 0;
    tbody.innerHTML = '';

    orders.forEach(order => {
      totalRevenue += parseFloat(order.total || 0);
      const items = Array.isArray(order.items) ? order.items.map(i => i.name).join(', ') : 'N/A';
      const date = order.createdAt ? new Date(order.createdAt).toLocaleDateString() : 'N/A';
      
      tbody.innerHTML += `
        <tr>
          <td>${order.id}</td>
          <td>${order.email}</td>
          <td>${items}</td>
          <td>$${order.total}</td>
          <td><span class="status-confirmed">${order.status}</span></td>
          <td>${date}</td>
        </tr>`;
    });

    document.getElementById('totalOrders').textContent = orders.length;
    document.getElementById('totalRevenue').textContent = '$' + totalRevenue.toFixed(2);

  } catch (error) {
    document.getElementById('ordersBody').innerHTML = 
      '<tr><td colspan="6" style="text-align:center;color:#666;padding:30px">Unable to load orders right now</td></tr>';
  }
}

loadOrders();
</script>
</body>
</html>
