<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMA - Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --navy: #0F1B2E; --gold: #B87333; --cream: #F2E9DC; }
* { box-sizing: border-box; }
body { margin: 0; font-family: 'Montserrat', sans-serif; background: #EDE4D6; }
header { background: var(--navy); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
header h1 { font-family: 'Playfair Display', serif; color: var(--gold); margin: 0; font-size: 1.6rem; }
header span { color: var(--cream); font-size: 0.85rem; }
.container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
.card { background: white; border-radius: 12px; padding: 30px; margin-bottom: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
.card h2 { font-family: 'Playfair Display', serif; color: var(--navy); margin: 0 0 20px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
.form-grid input, .form-grid select, .form-grid textarea { padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px; font-family: 'Montserrat', sans-serif; font-size: 0.9rem; width: 100%; }
.form-grid textarea { grid-column: span 2; resize: vertical; }
.form-grid .full { grid-column: span 2; }
.btn { background: var(--gold); color: var(--navy); border: none; padding: 11px 24px; border-radius: 8px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.9rem; transition: background 0.2s; }
.btn:hover { background: #a0622a; color: white; }
.btn-danger { background: #c0392b; color: white; }
.btn-danger:hover { background: #a93226; }
.btn-secondary { background: var(--navy); color: var(--cream); }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 12px; background: var(--navy); color: var(--cream); font-size: 0.8rem; letter-spacing: 1px; text-transform: uppercase; }
td { padding: 12px; border-bottom: 1px solid #eee; font-size: 0.88rem; color: #333; vertical-align: middle; }
tr:hover td { background: #fafafa; }
.badge { display: inline-block; padding: 3px 10px; border-radius: 20px; font-size: 0.7rem; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.badge-bev { background: #e8f4fd; color: #2980b9; }
.badge-bak { background: #fef9e7; color: #d4ac0d; }
.badge-mar { background: #eafaf1; color: #1e8449; }
.msg { padding: 12px 16px; border-radius: 8px; margin-bottom: 20px; font-size: 0.88rem; display: none; }
.msg.success { background: #eafaf1; color: #1e8449; display: block; }
.msg.error { background: #fdedec; color: #c0392b; display: block; }
.actions { display: flex; gap: 8px; }
</style>
</head>
<body>
<header>
  <h1>ALMA Admin Panel</h1>
  <span>Product Management</span>
</header>

<div class="container">
  <div id="msg" class="msg"></div>

  <div class="card">
    <h2 id="formTitle">Add New Product</h2>
    <div class="form-grid">
      <input type="hidden" id="productId">
      <input type="text" id="name" placeholder="Product name">
      <select id="category">
        <option value="">Select category</option>
        <option value="Beverages">Beverages</option>
        <option value="Bakery">Bakery</option>
        <option value="Market">Market</option>
      </select>
      <input type="number" id="price" placeholder="Price (e.g. 8.5)" step="0.01">
      <input type="text" id="image" placeholder="Image URL (optional)">
      <textarea id="description" rows="3" placeholder="Product description"></textarea>
      <div class="full" style="display:flex;gap:10px;">
        <button class="btn" onclick="saveProduct()">Save Product</button>
        <button class="btn btn-secondary" onclick="resetForm()">Cancel</button>
      </div>
    </div>
  </div>

  <div class="card">
    <h2>Products</h2>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productTable">
        <tr><td colspan="5" style="text-align:center;padding:30px;color:#999;">Loading...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
const API = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/products';

function badgeClass(cat) {
  if (cat === 'Beverages') return 'badge-bev';
  if (cat === 'Bakery') return 'badge-bak';
  return 'badge-mar';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  setTimeout(() => el.className = 'msg', 3000);
}

async function loadProducts() {
  const res = await fetch(API);
  const products = await res.json();
  const tbody = document.getElementById('productTable');
  if (!products.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#999;">No products found.</td></tr>';
    return;
  }
  tbody.innerHTML = products.map(p => `
    <tr>
      <td><strong>${p.name}</strong></td>
      <td><span class="badge ${badgeClass(p.category)}">${p.category}</span></td>
      <td>$${p.price}</td>
      <td style="max-width:300px;color:#666;">${p.description}</td>
      <td class="actions">
        <button class="btn btn-secondary" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
        <button class="btn btn-danger" onclick="deleteProduct('${p.id}', '${p.name}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function editProduct(p) {
  document.getElementById('productId').value = p.id;
  document.getElementById('name').value = p.name;
  document.getElementById('category').value = p.category;
  document.getElementById('price').value = p.price;
  document.getElementById('image').value = p.image || '';
  document.getElementById('description').value = p.description;
  document.getElementById('formTitle').textContent = 'Edit Product';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  document.getElementById('productId').value = '';
  document.getElementById('name').value = '';
  document.getElementById('category').value = '';
  document.getElementById('price').value = '';
  document.getElementById('image').value = '';
  document.getElementById('description').value = '';
  document.getElementById('formTitle').textContent = 'Add New Product';
}

async function saveProduct() {
  const id = document.getElementById('productId').value;
  const body = {
    name: document.getElementById('name').value,
    category: document.getElementById('category').value,
    price: document.getElementById('price').value,
    image: document.getElementById('image').value,
    description: document.getElementById('description').value
  };

  if (!body.name || !body.category || !body.price) {
    showMsg('Name, category and price are required.', 'error');
    return;
  }

  if (id) body.id = id;

  const res = await fetch(API, {
    method: id ? 'PUT' : 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });

  if (res.ok) {
    showMsg(id ? 'Product updated.' : 'Product created.', 'success');
    resetForm();
    loadProducts();
  } else {
    showMsg('Error saving product.', 'error');
  }
}

async function deleteProduct(id, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  const res = await fetch(API, {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  if (res.ok) {
    showMsg('Product deleted.', 'success');
    loadProducts();
  } else {
    showMsg('Error deleting product.', 'error');
  }
}

loadProducts();
</script>
</body>
</html>
