<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ALMA Cloud — Admin</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #8B6914;
      --gold-light: #C9A84C;
      --bg: #F5F0E8;
      --bg2: #FFFFFF;
      --bg3: #EDE8DF;
      --border: #D9D0C0;
      --text: #1A1A1A;
      --text-muted: #7A7060;
      --success: #2E7D52;
      --danger: #B03030;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      background: #1A1410;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
    }

    .logo {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--gold-light);
      letter-spacing: 0.08em;
    }

    .logo span {
      color: #888;
      font-size: 0.78rem;
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      margin-left: 0.5rem;
      letter-spacing: 0.04em;
    }

    nav { display: flex; gap: 0.5rem; }

    .nav-pill {
      padding: 0.4rem 1.1rem;
      border-radius: 20px;
      border: 1px solid #444;
      background: transparent;
      color: #AAA;
      cursor: pointer;
      font-size: 0.82rem;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      letter-spacing: 0.04em;
    }

    .nav-pill.active, .nav-pill:hover {
      background: var(--gold-light);
      color: #1A1410;
      border-color: var(--gold-light);
      font-weight: 600;
    }

    .store-link {
      color: #AAA;
      text-decoration: none;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      transition: color 0.2s;
    }
    .store-link:hover { color: var(--gold-light); }

    main { padding: 2rem; max-width: 1200px; margin: 0 auto; }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat-card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.6rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      color: var(--text);
      line-height: 1;
    }

    .stat-value.gold { color: var(--gold); }

    .section-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.4rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .table-wrap {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 2rem;
    }

    table { width: 100%; border-collapse: collapse; }

    thead { background: var(--bg3); }

    th {
      padding: 0.75rem 1rem;
      text-align: left;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      border-bottom: 1px solid var(--border);
    }

    td {
      padding: 0.85rem 1rem;
      font-size: 0.875rem;
      color: var(--text);
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }

    tr:last-child td { border-bottom: none; }
    tr:hover td { background: var(--bg3); }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.65rem;
      border-radius: 20px;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .badge-confirmed { background: rgba(46,125,82,0.12); color: var(--success); }
    .badge-pending { background: rgba(139,105,20,0.12); color: var(--gold); }

    .amount { color: var(--gold); font-weight: 600; }

    .empty-row td { text-align: center; color: var(--text-muted); padding: 2.5rem; }

    .order-id { font-size: 0.75rem; color: var(--text-muted); font-family: monospace; }

    .items-list { font-size: 0.82rem; color: var(--text); }

    .card {
      background: var(--bg2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    #formTitle {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 1rem;
    }

    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    .form-group { display: flex; flex-direction: column; gap: 0.4rem; }
    .form-group.full { grid-column: 1 / -1; }

    label {
      font-size: 0.72rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }

    input, select, textarea {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 0.6rem 0.85rem;
      font-size: 0.875rem;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
      outline: none;
    }

    input:focus, select:focus, textarea:focus { border-color: var(--gold-light); }

    textarea { resize: vertical; min-height: 80px; }

    .btn-row { display: flex; gap: 0.75rem; margin-top: 1rem; }

    .btn {
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      border: none;
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
    }

    .btn-primary { background: var(--gold-light); color: #1A1410; }
    .btn-primary:hover { background: var(--gold); color: #fff; }

    .btn-ghost {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover { color: var(--text); border-color: #999; }

    .btn-danger { background: rgba(176,48,48,0.1); color: var(--danger); border: 1px solid rgba(176,48,48,0.25); font-size: 0.78rem; padding: 0.3rem 0.75rem; }
    .btn-danger:hover { background: rgba(176,48,48,0.2); }

    .btn-edit { background: rgba(139,105,20,0.1); color: var(--gold); border: 1px solid rgba(139,105,20,0.25); font-size: 0.78rem; padding: 0.3rem 0.75rem; }
    .btn-edit:hover { background: rgba(139,105,20,0.2); }
  </style>
</head>
<body>

<header>
  <div class="logo">ALMA <span>Admin Panel</span></div>
  <nav>
    <button class="nav-pill active" onclick="switchTab('orders', this)">Dashboard</button>
    <button class="nav-pill" onclick="switchTab('products', this)">Products</button>
  </nav>
  <a href="index.html" class="store-link">View Store</a>
</header>

<main>

  <div id="tab-orders" class="tab-content active">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-label">Total Orders</div>
        <div class="stat-value" id="statOrders">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Total Revenue</div>
        <div class="stat-value gold" id="statRevenue">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Products Available</div>
        <div class="stat-value" id="statProducts">—</div>
      </div>
    </div>

    <div class="section-title">Recent Orders</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Order ID</th>
            <th>Customer</th>
            <th>Items</th>
            <th>Total</th>
            <th>Date</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="ordersBody">
          <tr class="empty-row"><td colspan="6">Loading orders...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <div id="tab-products" class="tab-content">
    <div class="card">
      <div id="formTitle">Add New Product</div>
      <div class="form-grid">
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label>Product Name</label>
          <input type="text" id="pName" placeholder="e.g. Maracuyá Burst" />
        </div>
        <div class="form-group">
          <label>Category</label>
          <select id="pCategory">
            <option value="">Select category</option>
            <option value="Beverages">Beverages</option>
            <option value="Bakery">Bakery</option>
            <option value="Market">Market</option>
          </select>
        </div>
        <div class="form-group">
          <label>Price (CAD)</label>
          <input type="number" id="pPrice" step="0.01" placeholder="0.00" />
        </div>
        <div class="form-group">
          <label>Image URL (optional)</label>
          <input type="text" id="pImage" placeholder="https://... or leave blank" />
        </div>
        <div class="form-group full">
          <label>Description</label>
          <textarea id="pDesc" placeholder="Short product description..."></textarea>
        </div>
      </div>
      <div class="btn-row">
        <button class="btn btn-primary" onclick="saveProduct()">Save Product</button>
        <button class="btn btn-ghost" onclick="resetForm()">Cancel</button>
      </div>
    </div>

    <div class="section-title">All Products</div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
            <th>Description</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="productsBody">
          <tr class="empty-row"><td colspan="5">Loading products...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</main>

<script>
  const PRODUCTS_API = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/products';
  const ORDERS_API   = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/orders';

  function switchTab(tab, btn) {
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-pill').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-' + tab).classList.add('active');
    btn.classList.add('active');
  }

  function fmt(date) {
    return new Date(date).toLocaleDateString('en-CA', { month: 'short', day: 'numeric', year: 'numeric' });
  }

  async function loadOrders() {
    try {
      const res = await fetch(ORDERS_API);
      const data = await res.json();
      const orders = Array.isArray(data) ? data : (data.orders || []);

      document.getElementById('statOrders').textContent = orders.length;
      const revenue = orders.reduce((sum, o) => sum + parseFloat(o.total || 0), 0);
      document.getElementById('statRevenue').textContent = '$' + revenue.toFixed(2);

      const sorted = [...orders].sort((a, b) => (b.createdAt || '').localeCompare(a.createdAt || '')).slice(0, 10);

      const tbody = document.getElementById('ordersBody');
      if (sorted.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="6">No orders yet.</td></tr>';
        return;
      }

      tbody.innerHTML = sorted.map(o => {
        const itemNames = (o.items || []).map(i => i.name).join(', ');
        const itemCount = (o.items || []).length;
        const badge = o.status === 'confirmed'
          ? '<span class="badge badge-confirmed">Confirmed</span>'
          : '<span class="badge badge-pending">' + (o.status || 'pending') + '</span>';
        return `<tr>
          <td><span class="order-id">#${o.id}</span></td>
          <td>${o.email || '—'}</td>
          <td><span class="items-list">${itemNames || '—'}</span><br><small style="color:var(--text-muted);font-size:0.78rem">${itemCount} item${itemCount !== 1 ? 's' : ''}</small></td>
          <td><span class="amount">$${parseFloat(o.total).toFixed(2)}</span></td>
          <td>${o.createdAt ? fmt(o.createdAt) : '—'}</td>
          <td>${badge}</td>
        </tr>`;
      }).join('');
    } catch (err) {
      document.getElementById('ordersBody').innerHTML =
        '<tr class="empty-row"><td colspan="6">Could not load orders: ' + err.message + '</td></tr>';
    }
  }

  let allProducts = [];

  async function loadProducts() {
    try {
      const res = await fetch(PRODUCTS_API);
      const data = await res.json();
      allProducts = Array.isArray(data) ? data : (data.products || data.items || []);

      document.getElementById('statProducts').textContent = allProducts.length;

      const tbody = document.getElementById('productsBody');
      if (allProducts.length === 0) {
        tbody.innerHTML = '<tr class="empty-row"><td colspan="5">No products found.</td></tr>';
        return;
      }

      tbody.innerHTML = allProducts.map(p => `<tr>
        <td><strong>${p.name}</strong></td>
        <td>${p.category || '—'}</td>
        <td><span class="amount">$${parseFloat(p.price || 0).toFixed(2)}</span></td>
        <td style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text-muted);font-size:0.82rem">${p.description || '—'}</td>
        <td style="display:flex;gap:0.5rem">
          <button class="btn btn-edit" onclick="editProduct('${p.id}')">Edit</button>
          <button class="btn btn-danger" onclick="deleteProduct('${p.id}','${p.name.replace(/'/g,"\\'")}')">Delete</button>
        </td>
      </tr>`).join('');
    } catch (err) {
      document.getElementById('productsBody').innerHTML =
        '<tr class="empty-row"><td colspan="5">Could not load products: ' + err.message + '</td></tr>';
    }
  }

  function editProduct(id) {
    const p = allProducts.find(x => x.id === id);
    if (!p) return;
    document.getElementById('editId').value = p.id;
    document.getElementById('pName').value = p.name;
    document.getElementById('pCategory').value = p.category || '';
    document.getElementById('pPrice').value = p.price;
    document.getElementById('pImage').value = p.image || '';
    document.getElementById('pDesc').value = p.description || '';
    document.getElementById('formTitle').textContent = 'Edit Product';
    document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.nav-pill').forEach(b => b.classList.remove('active'));
    document.getElementById('tab-products').classList.add('active');
    document.querySelectorAll('.nav-pill')[1].classList.add('active');
    window.scrollTo(0, 0);
  }

  function resetForm() {
    document.getElementById('editId').value = '';
    document.getElementById('pName').value = '';
    document.getElementById('pCategory').value = '';
    document.getElementById('pPrice').value = '';
    document.getElementById('pImage').value = '';
    document.getElementById('pDesc').value = '';
    document.getElementById('formTitle').textContent = 'Add New Product';
  }

  async function saveProduct() {
    const id = document.getElementById('editId').value;
    const body = {
      name: document.getElementById('pName').value.trim(),
      category: document.getElementById('pCategory').value,
      price: parseFloat(document.getElementById('pPrice').value),
      image: document.getElementById('pImage').value.trim(),
      description: document.getElementById('pDesc').value.trim()
    };

    if (!body.name || !body.category || isNaN(body.price)) {
      alert('Name, category and price are required.');
      return;
    }

    if (id) body.id = id;

    try {
      const res = await fetch(PRODUCTS_API, {
        method: id ? 'PUT' : 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      resetForm();
      loadProducts();
    } catch (err) {
      alert('Error saving product: ' + err.message);
    }
  }

  async function deleteProduct(id, name) {
    if (!confirm('Delete "' + name + '"?')) return;
    try {
      const res = await fetch(PRODUCTS_API, {
        method: 'DELETE',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      loadProducts();
    } catch (err) {
      alert('Error deleting: ' + err.message);
    }
  }

  loadOrders();
  loadProducts();
</script>
</body>
</html>
