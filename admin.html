<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMA - Admin Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=Montserrat:wght@200;300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<style>
:root { --navy: #0F1B2E; --gold: #B87333; --cream: #F2E9DC; }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Montserrat', sans-serif; background: linear-gradient(160deg, #D6C9B8 0%, #C8B89A 30%, #D4C4A8 60%, #BFB09A 100%); min-height: 100vh; }

header { background: var(--navy); padding: 0 48px; display: flex; justify-content: space-between; align-items: stretch; border-bottom: 2px solid var(--gold); }
.header-brand { display: flex; flex-direction: column; justify-content: center; padding: 18px 0; }
.header-brand .logo { font-family: 'Cormorant Garamond', serif; color: var(--gold); font-size: 2rem; font-weight: 300; letter-spacing: 10px; text-transform: uppercase; }
.header-brand .tagline { font-size: 0.55rem; letter-spacing: 5px; color: rgba(242,233,220,0.5); text-transform: uppercase; margin-top: 2px; }
.header-nav { display: flex; align-items: center; gap: 6px; }
.nav-pill { color: rgba(242,233,220,0.7); font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; padding: 8px 18px; border-radius: 20px; text-decoration: none; transition: all 0.2s; cursor: pointer; border: 1px solid transparent; }
.nav-pill:hover, .nav-pill.active { color: var(--gold); border-color: var(--gold); }
.nav-pill.store { background: var(--gold); color: var(--navy); border-color: var(--gold); font-weight: 600; }
.nav-pill.store:hover { background: #a0622a; }

.container { max-width: 1200px; margin: 0 auto; padding: 40px 24px; }

.stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
.stat-card { background: white; border-radius: 14px; padding: 28px 32px; box-shadow: 0 4px 20px rgba(0,0,0,0.07); border-top: 3px solid var(--gold); }
.stat-card .label { font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; color: rgba(15,27,46,0.5); margin-bottom: 10px; }
.stat-card .value { font-family: 'Playfair Display', serif; font-size: 2.4rem; color: var(--gold); }

.section { background: white; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,0.07); margin-bottom: 32px; overflow: hidden; }
.section-header { padding: 24px 32px; border-bottom: 1px solid #f0ebe4; display: flex; justify-content: space-between; align-items: center; }
.section-header h2 { font-family: 'Playfair Display', serif; color: var(--navy); font-size: 1.4rem; font-weight: 400; }

table { width: 100%; border-collapse: collapse; }
th { text-align: left; padding: 14px 20px; background: #faf7f4; color: rgba(15,27,46,0.5); font-size: 0.65rem; letter-spacing: 3px; text-transform: uppercase; border-bottom: 1px solid #ede8e0; }
td { padding: 14px 20px; border-bottom: 1px solid #f5f0eb; font-size: 0.85rem; color: #333; vertical-align: middle; }
tr:last-child td { border-bottom: none; }
tr:hover td { background: #fdfbf9; }

.badge { display: inline-block; padding: 3px 12px; border-radius: 20px; font-size: 0.65rem; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; }
.badge-confirmed { background: #eafaf1; color: #1e8449; }
.badge-bev { background: #e8f4fd; color: #2980b9; }
.badge-bak { background: #fef9e7; color: #b7950b; }
.badge-mar { background: #eafaf1; color: #1e8449; }

.form-panel { padding: 28px 32px; }
.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.form-grid input, .form-grid select, .form-grid textarea {
  padding: 11px 16px; border: 1.5px solid #e5ddd4; border-radius: 8px;
  font-family: 'Montserrat', sans-serif; font-size: 0.88rem; color: var(--navy);
  background: #fdfaf7; outline: none; width: 100%; transition: border-color 0.2s;
}
.form-grid input:focus, .form-grid select:focus, .form-grid textarea:focus { border-color: var(--gold); }
.form-grid textarea { grid-column: span 2; resize: vertical; min-height: 80px; }
.form-grid .full { grid-column: span 2; display: flex; gap: 10px; }
.btn { padding: 11px 24px; border-radius: 8px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.82rem; letter-spacing: 1px; text-transform: uppercase; border: none; transition: all 0.2s; }
.btn-gold { background: var(--gold); color: var(--navy); }
.btn-gold:hover { background: #a0622a; color: white; }
.btn-navy { background: var(--navy); color: var(--cream); }
.btn-navy:hover { background: #1a2d4a; }
.btn-danger { background: #c0392b; color: white; }
.btn-danger:hover { background: #a93226; }
.btn-sm { padding: 6px 14px; font-size: 0.72rem; border-radius: 6px; }
.actions { display: flex; gap: 6px; }

.msg { padding: 12px 20px; border-radius: 8px; font-size: 0.85rem; margin: 0 32px 20px; display: none; }
.msg.success { background: #eafaf1; color: #1e8449; display: block; }
.msg.error { background: #fdedec; color: #c0392b; display: block; }

.divider { width: 40px; height: 2px; background: var(--gold); margin: 4px 0 0; }
</style>
</head>
<body>

<header>
  <div class="header-brand">
    <div class="logo">ALMA</div>
    <div class="tagline">Venezuelan Flavours Café</div>
    <div class="divider"></div>
  </div>
  <nav class="header-nav">
    <span class="nav-pill active">Dashboard</span>
    <a href="index.html" class="nav-pill store">Store</a>
  </nav>
</header>

<div class="container">

  <div class="stats-row">
    <div class="stat-card">
      <div class="label">Total Orders</div>
      <div class="value" id="statOrders">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Total Revenue</div>
      <div class="value" id="statRevenue">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Products Available</div>
      <div class="value" id="statProducts">—</div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2>Recent Orders</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Order ID</th>
          <th>Email</th>
          <th>Items</th>
          <th>Total</th>
          <th>Status</th>
          <th>Date</th>
        </tr>
      </thead>
      <tbody id="ordersTable">
        <tr><td colspan="6" style="text-align:center;padding:30px;color:#aaa;">Loading orders...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="section">
    <div class="section-header">
      <h2 id="formTitle">Add New Product</h2>
    </div>
    <div id="msg" class="msg"></div>
    <div class="form-panel">
      <div class="form-grid">
        <input type="hidden" id="productId">
        <input type="text" id="name" placeholder="Product name">
        <select id="category">
          <option value="">Select category</option>
          <option value="Beverages">Beverages</option>
          <option value="Bakery">Bakery</option>
          <option value="Market">Market</option>
        </select>
        <input type="number" id="price" placeholder="Price (e.g. 8.5)" step="0.01">
        <input type="text" id="image" placeholder="Image URL (optional)">
        <textarea id="description" placeholder="Product description"></textarea>
        <div class="full">
          <button class="btn btn-gold" onclick="saveProduct()">Save Product</button>
          <button class="btn btn-navy" onclick="resetForm()">Cancel</button>
        </div>
      </div>
    </div>
  </div>

  <div class="section">
    <div class="section-header">
      <h2>Products</h2>
    </div>
    <table>
      <thead>
        <tr>
          <th>Name</th>
          <th>Category</th>
          <th>Price</th>
          <th>Description</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody id="productTable">
        <tr><td colspan="5" style="text-align:center;padding:30px;color:#aaa;">Loading products...</td></tr>
      </tbody>
    </table>
  </div>

</div>

<script>
const PRODUCTS_API = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/products';
const ORDERS_API = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/orders';

function badgeClass(cat) {
  if (cat === 'Beverages') return 'badge-bev';
  if (cat === 'Bakery') return 'badge-bak';
  return 'badge-mar';
}

function showMsg(text, type) {
  const el = document.getElementById('msg');
  el.textContent = text;
  el.className = 'msg ' + type;
  setTimeout(() => el.className = 'msg', 3000);
}

async function loadOrders() {
  try {
    const res = await fetch(ORDERS_API);
    const orders = await res.json();
    document.getElementById('statOrders').textContent = orders.length;
    const revenue = orders.reduce((sum, o) => sum + (o.total || 0), 0);
    document.getElementById('statRevenue').textContent = '$' + revenue.toFixed(2);
    const tbody = document.getElementById('ordersTable');
    if (!orders.length) {
      tbody.innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:#aaa;">No orders yet.</td></tr>';
      return;
    }
    const sorted = orders.sort((a, b) => b.timestamp - a.timestamp).slice(0, 10);
    tbody.innerHTML = sorted.map(o => `
      <tr>
        <td style="font-family:monospace;font-size:0.8rem;color:#888;">${o.orderId || o.id || '—'}</td>
        <td style="color:var(--gold);">${o.email || '—'}</td>
        <td>${Array.isArray(o.items) ? o.items.map(i => i.name).join(', ') : '—'}</td>
        <td><strong>$${(o.total || 0).toFixed(2)}</strong></td>
        <td><span class="badge badge-confirmed">${o.status || 'confirmed'}</span></td>
        <td style="color:#888;">${o.timestamp ? new Date(o.timestamp).toLocaleDateString() : '—'}</td>
      </tr>
    `).join('');
  } catch(e) {
    document.getElementById('ordersTable').innerHTML = '<tr><td colspan="6" style="text-align:center;padding:30px;color:#aaa;">Could not load orders.</td></tr>';
  }
}

async function loadProducts() {
  const res = await fetch(PRODUCTS_API);
  const products = await res.json();
  document.getElementById('statProducts').textContent = products.length;
  const tbody = document.getElementById('productTable');
  if (!products.length) {
    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:30px;color:#aaa;">No products found.</td></tr>';
    return;
  }
  tbody.innerHTML = products.map(p => `
    <tr>
      <td><strong>${p.name}</strong></td>
      <td><span class="badge ${badgeClass(p.category)}">${p.category}</span></td>
      <td>$${p.price}</td>
      <td style="max-width:280px;color:#666;font-size:0.82rem;">${p.description}</td>
      <td class="actions">
        <button class="btn btn-navy btn-sm" onclick='editProduct(${JSON.stringify(p)})'>Edit</button>
        <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}','${p.name}')">Delete</button>
      </td>
    </tr>
  `).join('');
}

function editProduct(p) {
  document.getElementById('productId').value = p.id;
  document.getElementById('name').value = p.name;
  document.getElementById('category').value = p.category;
  document.getElementById('price').value = p.price;
  document.getElementById('image').value = p.image || '';
  document.getElementById('description').value = p.description;
  document.getElementById('formTitle').textContent = 'Edit Product';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function resetForm() {
  ['productId','name','price','image','description'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('category').value = '';
  document.getElementById('formTitle').textContent = 'Add New Product';
}

async function saveProduct() {
  const id = document.getElementById('productId').value;
  const body = {
    name: document.getElementById('name').value,
    category: document.getElementById('category').value,
    price: document.getElementById('price').value,
    image: document.getElementById('image').value,
    description: document.getElementById('description').value
  };
  if (!body.name || !body.category || !body.price) { showMsg('Name, category and price are required.', 'error'); return; }
  if (id) body.id = id;
  const res = await fetch(PRODUCTS_API, { method: id ? 'PUT' : 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (res.ok) { showMsg(id ? 'Product updated.' : 'Product created.', 'success'); resetForm(); loadProducts(); }
  else showMsg('Error saving product.', 'error');
}

async function deleteProduct(id, name) {
  if (!confirm(`Delete "${name}"?`)) return;
  const res = await fetch(PRODUCTS_API, { method: 'DELETE', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
  if (res.ok) { showMsg('Product deleted.', 'success'); loadProducts(); }
  else showMsg('Error deleting product.', 'error');
}

loadOrders();
loadProducts();
</script>
</body>
</html>
