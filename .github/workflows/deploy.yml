name: Deploy ALMA Cloud

on:
  push:
    branches:
      - main

jobs:
  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: us-east-1

      - name: Deploy to S3
        run: |
          aws s3 cp index.html s3://caa900-almacloud-frontend/index.html
          aws s3 cp cart.html s3://caa900-almacloud-frontend/cart.html
          aws s3 cp confirmation.html s3://caa900-almacloud-frontend/confirmation.html
          aws s3 cp admin.html s3://caa900-almacloud-frontend/admin.html

      - name: Deployment complete
        run: echo "ALMA Cloud frontend deployed successfully"
