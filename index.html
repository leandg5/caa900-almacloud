<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMA - Taste the Soul of Venezuela</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300;1,400&family=Montserrat:wght@200;300;400;600&family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/amazon-cognito-identity-js/dist/amazon-cognito-identity.min.js"></script>
<style>
:root { --navy: #0F1B2E; --gold: #B87333; --cream: #F2E9DC; }
body { margin: 0; font-family: 'Montserrat', sans-serif; background: #EDE4D6; }
header { position: absolute; top: 0; left: 0; right: 0; z-index: 10; background: linear-gradient(to bottom, rgba(15,27,46,0.7) 0%, rgba(15,27,46,0) 100%); padding: 22px 48px; display: flex; justify-content: flex-end; align-items: center; }
nav { display: flex; align-items: center; gap: 8px; }
nav a { color: rgba(242,233,220,0.9); text-decoration: none; padding: 6px 20px; font-size: 1.1rem; cursor: pointer; font-family: 'Cormorant Garamond', serif; font-weight: 400; letter-spacing: 4px; text-transform: uppercase; transition: color 0.2s; }
nav a:hover { color: var(--gold); }
.hero { position: relative; text-align: center; overflow: hidden; }
.hero img { width: 100%; display: block; height: auto; }
.products { padding: 60px 40px; background: linear-gradient(160deg, #D6C9B8 0%, #C8B89A 30%, #D4C4A8 60%, #BFB09A 100%); }
.products-header { text-align: center; margin-bottom: 48px; }
.products-header h2 { font-family: 'Cormorant Garamond', serif; color: var(--navy); margin: 0 0 10px; font-size: 2.4rem; font-weight: 300; letter-spacing: 8px; text-transform: uppercase; }
.products-header .header-line { width: 50px; height: 1px; background: var(--gold); margin: 0 auto 10px; }
.products-header p { font-family: 'Montserrat', sans-serif; font-size: 0.6rem; letter-spacing: 4px; color: rgba(15,27,46,0.55); text-transform: uppercase; margin: 0; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 30px; }
.card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.08); transition: transform 0.2s, box-shadow 0.2s; }
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 25px rgba(0,0,0,0.13); }
.card-img-wrap { width: 100%; height: 240px; overflow: hidden; }
.card-img { width: 100%; height: 100%; object-fit: cover; object-position: center 50%; display: block; }
.card-body { padding: 20px; }
.card h3 { font-family: 'Playfair Display', serif; color: var(--navy); margin: 0 0 5px; }
.card p { color: #666; font-size: 0.9rem; margin-bottom: 15px; }
.price { color: var(--gold); font-weight: 600; font-size: 1.1rem; margin-bottom: 15px; }
.btn { background: var(--gold); color: var(--navy); border: none; padding: 10px 20px; border-radius: 6px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; width: 100%; transition: background 0.2s; }
.btn:hover { background: #a0622a; color: white; }
.category { color: var(--gold); font-size: 0.75rem; letter-spacing: 2px; text-transform: uppercase; margin-bottom: 5px; }
footer { background: var(--navy); color: var(--cream); text-align: center; padding: 60px 40px 40px; border-top: 1px solid rgba(184,115,51,0.3); }
.footer-logo { font-family: 'Cormorant Garamond', serif; font-size: 2.8rem; font-weight: 300; letter-spacing: 14px; color: var(--gold); text-transform: uppercase; margin-bottom: 6px; }
.footer-tagline { font-size: 0.65rem; letter-spacing: 6px; text-transform: uppercase; color: rgba(242,233,220,0.75); font-family: 'Montserrat', sans-serif; font-weight: 300; margin-bottom: 30px; }
.footer-divider { width: 60px; height: 1px; background: rgba(184,115,51,0.4); margin: 0 auto 24px; }
.footer-bottom { font-size: 0.65rem; letter-spacing: 3px; color: rgba(242,233,220,0.6); font-family: 'Montserrat', sans-serif; text-transform: uppercase; }
.modal { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:1000; justify-content:center; align-items:center; }
.modal.active { display:flex; }
.modal-box { background:var(--cream); padding:40px; border-radius:12px; width:350px; }
.modal-box h2 { font-family:'Playfair Display',serif; color:var(--navy); margin-bottom:20px; }
.modal-box input { width:100%; padding:10px; margin-bottom:15px; border:1px solid #ddd; border-radius:6px; font-family:'Montserrat',sans-serif; box-sizing:border-box; }
.modal-box button { background:var(--gold); color:var(--navy); border:none; padding:12px; width:100%; border-radius:6px; cursor:pointer; font-weight:600; margin-bottom:10px; }
.loading { text-align:center; padding:40px; color:var(--navy); font-family:'Playfair Display',serif; }
.cart-count { background:var(--gold); color:var(--navy); border-radius:50%; padding:2px 7px; font-size:0.75rem; font-weight:600; margin-left:5px; }
.user-greeting { color: var(--gold); font-size: 0.85rem; margin-left: 20px; }
.btn-logout { background: none; border: 1px solid var(--cream); color: var(--cream); padding: 4px 12px; border-radius: 20px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-size: 0.8rem; margin-left: 10px; }
.btn-logout:hover { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.filters { display: flex; justify-content: center; gap: 12px; margin-bottom: 40px; flex-wrap: wrap; }
.filter-btn { background: white; color: var(--navy); border: 2px solid var(--navy); padding: 8px 24px; border-radius: 30px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 0.85rem; letter-spacing: 1px; transition: all 0.2s; }
.filter-btn:hover { background: var(--navy); color: var(--cream); }
.filter-btn.active { background: var(--gold); color: var(--navy); border-color: var(--gold); }
.search-bar { display: flex; justify-content: center; margin-bottom: 24px; }
.search-bar input { width: 100%; max-width: 480px; padding: 12px 20px; border: 2px solid var(--navy); border-radius: 30px; font-family: 'Montserrat', sans-serif; font-size: 0.9rem; outline: none; background: white; color: var(--navy); }
.search-bar input:focus { border-color: var(--gold); }
</style>
</head>
<body>
<header>
  <nav>
    <a href="index.html">Products</a>
    <a href="cart.html">Cart <span class="cart-count" id="cartCount">0</span></a>
    <span id="authNav">
      <a onclick="openModal()">Login</a>
    </span>
  </nav>
</header>

<div class="hero">
  <img src="showcase.png" alt="ALMA - Venezuelan Flavours">
</div>

<div class="products">
  <div class="products-header">
    <h2>Our Products</h2>
    <div class="header-line"></div>
    <p>Handcrafted Venezuelan Flavours</p>
  </div>
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search products..." oninput="searchProducts()" autocomplete="new-password" autocorrect="off" autocapitalize="off" spellcheck="false" readonly onfocus="this.removeAttribute('readonly')">
  </div>
  <div class="filters">
    <button class="filter-btn active" onclick="filterProducts('All')">All</button>
    <button class="filter-btn" onclick="filterProducts('Beverages')">Beverages</button>
    <button class="filter-btn" onclick="filterProducts('Bakery')">Bakery</button>
    <button class="filter-btn" onclick="filterProducts('Market')">Market</button>
  </div>
  <div class="grid" id="productsGrid">
    <div class="loading">Loading products...</div>
  </div>
</div>

<footer>
  <div class="footer-logo">ALMA</div>
  <div class="footer-tagline">Venezuelan Flavours Café</div>
  <div class="footer-divider"></div>
  <div class="footer-bottom">Taste the Soul of Venezuela &nbsp;·&nbsp; Toronto, Canada &nbsp;·&nbsp; © 2026</div>
</footer>

<div class="modal" id="authModal">
  <div class="modal-box">
    <h2 id="modalTitle">Login</h2>
    <input type="email" id="authEmail" placeholder="Email">
    <input type="password" id="authPassword" placeholder="Password">
    <button onclick="handleAuth()">Continue</button>
    <p style="text-align:center;cursor:pointer;color:var(--gold);" onclick="toggleMode()" id="toggleText">Don't have an account? Sign up</p>
  </div>
</div>

<script>
const API_URL = 'https://dnkjlq3ie4.execute-api.us-east-1.amazonaws.com/products';
const poolData = { UserPoolId: 'us-east-1_2j5XfbyQ8', ClientId: '6hahghern9ph1b6no8mqo6l4p1' };
const userPool = new AmazonCognitoIdentity.CognitoUserPool(poolData);
let isLogin = true;
let allProducts = [];
let activeFilter = 'All';

function searchProducts() {
  const query = document.getElementById('searchInput').value.toLowerCase();
  const filtered = allProducts.filter(p =>
    p.name.toLowerCase().includes(query) || p.description.toLowerCase().includes(query)
  );
  renderProducts(filtered);
}

function filterProducts(category) {
  document.getElementById('searchInput').value = '';
  activeFilter = category;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.textContent === category);
  });
  const filtered = category === 'All' ? allProducts : allProducts.filter(p => p.category === category);
  renderProducts(filtered);
}

function renderProducts(products) {
  const grid = document.getElementById('productsGrid');
  grid.innerHTML = '';
  if (products.length === 0) {
    grid.innerHTML = '<div class="loading">No products in this category.</div>';
    return;
  }
  products.forEach(product => {
    const imgSrc = product.image
      ? product.image
      : `img/${product.name.toLowerCase().replace(/[\s]+/g, '-').replace(/[^a-z0-9-]/g, '')}.png`;
    const imgHtml = `<div class="card-img-wrap"><img class="card-img" src="${imgSrc}" alt="${product.name}" onerror="this.parentElement.style.display='none'"></div>`;
    grid.innerHTML += `
      <div class="card">
        ${imgHtml}
        <div class="card-body">
          <div class="category">${product.category}</div>
          <h3>${product.name}</h3>
          <p>${product.description}</p>
          <div class="price">$${product.price}</div>
          <button class="btn" onclick="addToCart('${product.id}', '${product.name}', '${product.category}', ${product.price})">Add to Cart</button>
        </div>
      </div>`;
  });
}

function updateCartCount() {
  const cart = JSON.parse(localStorage.getItem('alma-cart') || '[]');
  document.getElementById('cartCount').textContent = cart.length;
}

function checkAuthState() {
  const cognitoUser = userPool.getCurrentUser();
  if (cognitoUser) {
    cognitoUser.getSession((err, session) => {
      if (!err && session.isValid()) {
        cognitoUser.getUserAttributes((err, attrs) => {
          const emailAttr = attrs && attrs.find(a => a.Name === 'email');
          const email = emailAttr ? emailAttr.Value : cognitoUser.getUsername();
          const name = email.split('@')[0];
          document.getElementById('authNav').innerHTML = `
            <span class="user-greeting">Hi, ${name}</span>
            <button class="btn-logout" onclick="handleLogout()">Logout</button>
          `;
        });
      }
    });
  }
}

function handleLogout() {
  const cognitoUser = userPool.getCurrentUser();
  if (cognitoUser) cognitoUser.signOut();
  document.getElementById('authNav').innerHTML = `<a onclick="openModal()">Login</a>`;
}

function addToCart(id, name, category, price) {
  const cart = JSON.parse(localStorage.getItem('alma-cart') || '[]');
  cart.push({ id, name, category, price });
  localStorage.setItem('alma-cart', JSON.stringify(cart));
  updateCartCount();
  alert(name + ' added to cart!');
}

async function loadProducts() {
  try {
    const response = await fetch(API_URL);
    allProducts = await response.json();
    renderProducts(allProducts);
  } catch (error) {
    document.getElementById('productsGrid').innerHTML = '<div class="loading">Error loading products.</div>';
  }
}

function openModal() { document.getElementById('authModal').classList.add('active'); }
function toggleMode() {
  isLogin = !isLogin;
  document.getElementById('modalTitle').textContent = isLogin ? 'Login' : 'Sign Up';
  document.getElementById('toggleText').textContent = isLogin ? "Don't have an account? Sign up" : 'Already have an account? Login';
}
function handleAuth() {
  const email = document.getElementById('authEmail').value;
  const password = document.getElementById('authPassword').value;
  if (isLogin) {
    const authDetails = new AmazonCognitoIdentity.AuthenticationDetails({ Username: email, Password: password });
    const cognitoUser = new AmazonCognitoIdentity.CognitoUser({ Username: email, Pool: userPool });
    cognitoUser.authenticateUser(authDetails, {
      onSuccess: () => {
        document.getElementById('authModal').classList.remove('active');
        checkAuthState();
      },
      onFailure: (err) => alert(err.message)
    });
  } else {
    const attributeList = [new AmazonCognitoIdentity.CognitoUserAttribute({ Name: 'email', Value: email })];
    userPool.signUp(email, password, attributeList, null, (err) => {
      if (err) { alert(err.message); return; }
      alert('Account created! Check your email to verify your account.');
      document.getElementById('authModal').classList.remove('active');
    });
  }
}

loadProducts();
updateCartCount();
checkAuthState();
</script>
</body>
</html>
