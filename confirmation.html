<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMA - Order Confirmed</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root { --navy: #0F1B2E; --gold: #B87333; --cream: #F2E9DC; }
body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--cream); }
header { background: var(--navy); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
header h1 { color: var(--gold); font-family: 'Playfair Display', serif; margin: 0; font-size: 2rem; }
header p { color: var(--cream); margin: 0; font-size: 0.8rem; letter-spacing: 2px; }
nav a { color: var(--cream); text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
.confirmation { max-width: 600px; margin: 80px auto; padding: 0 20px; text-align: center; }
.checkmark { width: 80px; height: 80px; background: var(--gold); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 30px; }
.checkmark svg { width: 40px; height: 40px; fill: none; stroke: var(--navy); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.confirmation h2 { font-family: 'Playfair Display', serif; color: var(--navy); font-size: 2rem; margin-bottom: 10px; }
.confirmation p { color: #666; font-size: 0.95rem; margin-bottom: 30px; }
.order-summary { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: left; margin-bottom: 30px; }
.order-summary h3 { font-family: 'Playfair Display', serif; color: var(--navy); margin: 0 0 20px 0; }
.order-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-size: 0.9rem; }
.order-item:last-of-type { border-bottom: none; }
.order-item span:first-child { color: #333; }
.order-item span:last-child { color: var(--gold); font-weight: 600; }
.order-total { display: flex; justify-content: space-between; padding-top: 15px; font-weight: 600; font-size: 1rem; color: var(--navy); border-top: 2px solid var(--cream); margin-top: 10px; }
.email-notice { background: #f0f8f0; border-radius: 8px; padding: 15px; font-size: 0.85rem; color: #555; margin-bottom: 30px; }
.btn { display: inline-block; background: var(--gold); color: var(--navy); border: none; padding: 14px 40px; border-radius: 6px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 1rem; text-decoration: none; }
footer { background: var(--navy); color: var(--cream); text-align: center; padding: 30px; font-size: 0.85rem; letter-spacing: 2px; margin-top: 60px; }
</style>
</head>
<body>
<header>
  <div><h1>ALMA</h1><p>TASTE THE SOUL OF VENEZUELA</p></div>
  <nav><a href="index.html">Products</a><a href="cart.html">Cart</a></nav>
</header>

<div class="confirmation">
  <div class="checkmark">
    <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"></polyline></svg>
  </div>
  <h2>Order Confirmed!</h2>
  <p>Thank you for your purchase. Your Venezuelan flavors are on their way.</p>

  <div class="order-summary">
    <h3>Order Summary</h3>
    <div id="orderItems"></div>
    <div class="order-total">
      <span>Total Paid</span>
      <span id="orderTotal">$0.00</span>
    </div>
  </div>

  <div class="email-notice">
    A confirmation email has been sent to your inbox.
  </div>

  <a href="index.html" class="btn">Continue Shopping</a>
</div>

<footer>ALMA · TASTE THE SOUL OF VENEZUELA · TORONTO</footer>

<script>
const order = JSON.parse(localStorage.getItem('alma-order') || '[]');

if (order.length > 0) {
  let total = 0;
  const itemsContainer = document.getElementById('orderItems');
  itemsContainer.innerHTML = '';

  order.forEach(item => {
    total += parseFloat(item.price);
    itemsContainer.innerHTML += `
      <div class="order-item">
        <span>${item.name}</span>
        <span>$${parseFloat(item.price).toFixed(2)}</span>
      </div>`;
  });

  document.getElementById('orderTotal').textContent = '$' + total.toFixed(2);
  localStorage.removeItem('alma-order');
}
</script>
</body>
</html>
