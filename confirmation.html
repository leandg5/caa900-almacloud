<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALMA - Order Confirmation</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root { --navy: #0F1B2E; --gold: #B87333; --cream: #F2E9DC; }
body { margin: 0; font-family: 'Montserrat', sans-serif; background: var(--cream); }
header { background: var(--navy); padding: 20px 40px; display: flex; justify-content: space-between; align-items: center; }
header h1 { color: var(--gold); font-family: 'Playfair Display', serif; margin: 0; font-size: 2rem; }
header p { color: var(--cream); margin: 0; font-size: 0.8rem; letter-spacing: 2px; }
nav a { color: var(--cream); text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
.confirmation-container { max-width: 600px; margin: 60px auto; padding: 0 20px; text-align: center; }
.check-icon { font-size: 4rem; margin-bottom: 20px; }
.confirmation-container h2 { font-family: 'Playfair Display', serif; color: var(--navy); font-size: 2rem; margin-bottom: 10px; }
.confirmation-container p { color: #666; margin-bottom: 30px; }
.order-summary { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); text-align: left; margin-bottom: 30px; }
.order-summary h3 { font-family: 'Playfair Display', serif; color: var(--navy); margin-bottom: 20px; }
.order-item { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
.order-item:last-child { border-bottom: none; }
.order-total { display: flex; justify-content: space-between; font-weight: 600; color: var(--navy); margin-top: 15px; font-size: 1.1rem; }
.btn-continue { background: var(--gold); color: var(--navy); border: none; padding: 15px 40px; border-radius: 6px; cursor: pointer; font-family: 'Montserrat', sans-serif; font-weight: 600; font-size: 1rem; text-decoration: none; display: inline-block; }
.email-note { background: var(--navy); color: var(--cream); padding: 15px 20px; border-radius: 8px; margin-bottom: 30px; font-size: 0.9rem; }
footer { background: var(--navy); color: var(--cream); text-align: center; padding: 30px; font-size: 0.85rem; letter-spacing: 2px; margin-top: 60px; }
</style>
</head>
<body>
<header>
  <div><h1>ALMA</h1><p>TASTE THE SOUL OF VENEZUELA</p></div>
  <nav><a href="index.html">Products</a><a href="cart.html">Cart</a></nav>
</header>

<div class="confirmation-container">
  <div class="check-icon">✓</div>
  <h2>Thank you for your order!</h2>
  <p>Your order has been placed successfully.</p>

  <div class="email-note">
    A confirmation email has been sent to your email address.
  </div>

  <div class="order-summary">
    <h3>Order Summary</h3>
    <div id="orderItems"></div>
    <div class="order-total">
      <span>Total</span>
      <span id="orderTotal"></span>
    </div>
  </div>

  <a href="index.html" class="btn-continue">Continue Shopping</a>
</div>

<footer>ALMA · TASTE THE SOUL OF VENEZUELA · TORONTO</footer>

<script>
const order = JSON.parse(localStorage.getItem('alma-order') || '[]');
const orderItems = document.getElementById('orderItems');
let total = 0;

if (order.length === 0) {
  window.location.href = 'index.html';
}

order.forEach(item => {
  total += parseFloat(item.price);
  orderItems.innerHTML += `
    <div class="order-item">
      <span>${item.name}</span>
      <span>$${item.price}</span>
    </div>`;
});

document.getElementById('orderTotal').textContent = '$' + total.toFixed(2);
localStorage.removeItem('alma-cart');
</script>
</body>
</html>
